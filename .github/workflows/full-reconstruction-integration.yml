name: Full Reconstruction Integration

on:
  push:
    branches:
      - codex/auto-template-phase1
    paths:
      - .github/workflows/full-reconstruction-integration.yml
      - environment.base.yml
      - envs/**
      - run_gmsm.py
      - gmsm/**
      - scripts/run_full_integration_check.py
      - scripts/check_runtime_stack.py
      - scripts/fetch_template_genome_bank.py
      - scripts/fetch_runtime_assets.py
      - scripts/runtime_assets_manifest.json
      - scripts/check_template_genome_bank.py
  workflow_dispatch:

jobs:
  full-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_file: envs/environment.linux-64.yml
            expected_backend: diamond
          - os: macos-14
            platform_file: envs/environment.osx-arm64.yml
            expected_backend: diamond
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniconda-version: "latest"

      - name: Create base environment
        run: |
          conda env create -n gmsm -f environment.base.yml
          conda env update -n gmsm -f ${{ matrix.platform_file }}

      - name: Install DIAMOND
        run: |
          conda install -n gmsm -c bioconda -c conda-forge diamond -y

      - name: Fetch required runtime assets for full integration
        run: |
          conda activate gmsm
          python scripts/fetch_runtime_assets.py --json

      - name: Runtime stack sanity check
        run: |
          conda activate gmsm
          python scripts/check_runtime_stack.py \
            --json \
            --output runtime-stack-full.json \
            --require-executable diamond \
            --require-module cobra \
            --require-module optlang \
            --require-module libsbml \
            --require-module swiglpk

      - name: Install template genome bank
        run: |
          conda activate gmsm
          python scripts/fetch_template_genome_bank.py --from-manifest --force
          python scripts/check_template_genome_bank.py

      - name: Run full reconstruction integration validator
        id: integration
        continue-on-error: true
        run: |
          conda activate gmsm
          python scripts/run_full_integration_check.py \
            --template-backend "${{ matrix.expected_backend }}" \
            --expected-backend "${{ matrix.expected_backend }}" \
            --skip-secondary \
            --report-dir full-integration-artifacts \
            --output-dir full-integration-output

      - name: Show full integration summary
        if: always()
        run: |
          if [ -f full-integration-artifacts/full_integration_summary.json ]; then
            echo "===== full_integration_summary.json ====="
            cat full-integration-artifacts/full_integration_summary.json
          else
            echo "full_integration_summary.json not found"
          fi

      - name: Show full integration log tail
        if: always()
        run: |
          if [ -f full-integration-artifacts/full_integration.log ]; then
            echo "===== tail full_integration.log ====="
            tail -n 200 full-integration-artifacts/full_integration.log
          else
            echo "full_integration.log not found"
          fi

      - name: Upload runtime stack report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-stack-full-${{ matrix.os }}
          path: runtime-stack-full.json
          if-no-files-found: warn

      - name: Upload full integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-reconstruction-integration-${{ matrix.os }}
          path: full-integration-artifacts
          if-no-files-found: warn

      - name: Fail if integration validator failed
        if: steps.integration.outcome != 'success'
        run: |
          echo "Full reconstruction integration validator failed"
          exit 1
