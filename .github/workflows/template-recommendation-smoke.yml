name: Template Recommendation Smoke

on:
  push:
    branches:
      - codex/auto-template-phase1
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_file: envs/environment.linux-64.yml
            diamond_install: conda
            skani_install: conda
            require_skani: true
            install_template_bank: true
            expected_backend: skani
          - os: macos-14
            platform_file: envs/environment.osx-arm64.yml
            diamond_install: conda
            skani_install: brew
            require_skani: true
            install_template_bank: true
            expected_backend: skani
          - os: windows-latest
            platform_file: envs/environment.win-64.yml
            diamond_install: release
            skani_install: none
            require_skani: false
            install_template_bank: true
            expected_backend: diamond
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniconda-version: "latest"

      - name: Create base environment
        run: |
          conda env create -n gmsm -f environment.base.yml
          conda env update -n gmsm -f ${{ matrix.platform_file }}

      - name: Install DIAMOND
        if: matrix.diamond_install == 'conda'
        run: |
          conda install -n gmsm -c bioconda -c conda-forge diamond -y

      - name: Install DIAMOND from official Windows release
        if: matrix.diamond_install == 'release'
        run: |
          conda activate gmsm
          python scripts/install_diamond_windows.py --json

      - name: Install skani via conda
        if: matrix.skani_install == 'conda'
        run: |
          conda install -n gmsm -c bioconda skani -y

      - name: Install skani via Homebrew
        if: matrix.skani_install == 'brew'
        run: |
          brew install skani

      - name: Runtime stack sanity check
        run: |
          conda activate gmsm
          args=(
            --json
            --output runtime-stack-smoke.json
            --require-executable diamond
            --require-module cobra
            --require-module optlang
            --require-module libsbml
            --require-module swiglpk
          )
          if [ "${{ matrix.require_skani }}" = "true" ]; then
            args+=(--require-executable skani)
          fi
          python scripts/check_runtime_stack.py "${args[@]}"

      - name: Upload runtime stack report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-stack-smoke-${{ matrix.os }}
          path: runtime-stack-smoke.json
          if-no-files-found: warn

      - name: Install template genome bank
        if: matrix.install_template_bank
        run: |
          conda activate gmsm
          python scripts/fetch_template_genome_bank.py --from-manifest --force
          python scripts/check_template_genome_bank.py

      - name: Recommendation-only smoke
        run: |
          conda activate gmsm
          python scripts/run_template_recommendation_smoke.py \
            --expected-backend "${{ matrix.expected_backend }}" \
            --template-backend "${{ matrix.expected_backend }}" \
            --report-dir smoke-artifacts

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-recommendation-smoke-${{ matrix.os }}
          path: smoke-artifacts
          if-no-files-found: warn
